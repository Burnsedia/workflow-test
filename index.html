<!doctype html>
<!--
  @file Vite HTML entry. Serves the favicon, viewport, and font preconnects
  (Inter + Newsreader, matching the `@theme` stacks in `src/style.css`).
  The `#app` div is the mount target for `src/main.ts`.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hermes — local-first, agent-built Vue 3 + TypeScript application template." />
    <title>Hermes Template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz@6..72&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
