<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Dashboard wireframe</title>
  <desc id="desc">Wireframe of the logged-in dashboard: sidebar navigation, topbar, and content cards.</desc>
  <style>
    .box { stroke: #7c6b8a; stroke-width: 1.5; fill: none; }
    .fill { fill: #f3eef6; }
    .line { stroke: #b9a8c6; stroke-width: 1; }
    .tag { font: 600 15px system-ui, sans-serif; fill: #4a3b57; }
    .lbl { font: 13px system-ui, sans-serif; fill: #8a7794; }
  </style>

  <!-- Sidebar -->
  <rect class="box fill" x="20" y="20" width="240" height="760" rx="12"/>
  <text class="tag" x="48" y="64">Hermes</text>
  <line class="line" x1="48" y1="84" x2="232" y2="84"/>
  <text class="lbl" x="48" y="124">Overview</text>
  <text class="lbl" x="48" y="164">Agents</text>
  <text class="lbl" x="48" y="204">Sessions</text>
  <text class="lbl" x="48" y="244">Settings</text>

  <!-- Topbar -->
  <rect class="box" x="280" y="20" width="900" height="60" rx="12"/>
  <text class="tag" x="308" y="56">Dashboard</text>
  <rect class="box" x="1000" y="36" width="100" height="28" rx="6"/>
  <text class="lbl" x="1018" y="54">Sign out</text>

  <!-- Stat cards -->
  <rect class="box fill" x="280" y="100" width="280" height="120" rx="12"/>
  <text class="lbl" x="308" y="132">Active agents</text>
  <text class="tag" x="308" y="180">3</text>

  <rect class="box fill" x="580" y="100" width="280" height="120" rx="12"/>
  <text class="lbl" x="608" y="132">Sessions today</text>
  <text class="tag" x="608" y="180">12</text>

  <rect class="box fill" x="880" y="100" width="300" height="120" rx="12"/>
  <text class="lbl" x="908" y="132">Success rate</text>
  <text class="tag" x="908" y="180">94%</text>

  <!-- Content cards -->
  <rect class="box fill" x="280" y="240" width="440" height="300" rx="12"/>
  <text class="lbl" x="308" y="272">Agent activity</text>
  <line class="line" x1="308" y1="290" x2="692" y2="290"/>
  <rect class="box" x="308" y="310" width="356" height="60" rx="8"/>
  <rect class="box" x="308" y="386" width="356" height="60" rx="8"/>
  <rect class="box" x="308" y="462" width="356" height="60" rx="8"/>

  <rect class="box fill" x="740" y="240" width="440" height="300" rx="12"/>
  <text class="lbl" x="768" y="272">Recent sessions</text>
  <line class="line" x1="768" y1="290" x2="1152" y2="290"/>
  <rect class="box" x="768" y="310" width="384" height="40" rx="8"/>
  <rect class="box" x="768" y="366" width="384" height="40" rx="8"/>
  <rect class="box" x="768" y="422" width="384" height="40" rx="8"/>
  <rect class="box" x="768" y="478" width="384" height="40" rx="8"/>

  <!-- Footer note -->
  <rect class="box" x="280" y="560" width="900" height="200" rx="12"/>
  <text class="lbl" x="308" y="592">Agent status legend</text>
  <line class="line" x1="308" y1="610" x2="1152" y2="610"/>
  <text class="lbl" x="308" y="646">- running</text>
  <text class="lbl" x="308" y="676">- blocked (needs human review)</text>
  <text class="lbl" x="308" y="706">- done</text>
  <text class="lbl" x="308" y="736">- failed</text>
</svg>